name: Build macOS installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Build and verify universal DMG
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export FOCUSAPP_RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          ./scripts/build-dmg.sh
          cd dist
          shasum -a 256 -c FocusApp.dmg.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: FocusApp-macOS
          path: |
            dist/FocusApp.dmg
            dist/FocusApp.dmg.sha256
          if-no-files-found: error
